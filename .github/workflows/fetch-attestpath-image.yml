name: Fetch AttestPath Creative

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        run: |
          curl -L --fail --retry 3 "https://i.ibb.co/hxBdzXdH/Attest-Path-SOC-2-advertisement-20260925130650.jpg" -o "Attest-Path-SOC-2-advertisement-20260925130650.jpg"
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Attest-Path-SOC-2-advertisement-20260925130650.jpg"
          git diff --cached --quiet || git commit -m "Add AttestPath SOC 2 ad creative"
          git push
